<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Scanned by Nexlink Solutions</title>
<meta name="description" content="Log in to your Scanned by Nexlink Solutions account to manage your contact card.">
<meta name="theme-color" content="#050505">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
</head>
<body>

  <!-- Mobile Menu Overlay -->
  <div id="mobile-menu" class="mobile-menu" aria-hidden="true">
    <a href="index.html" class="mobile-menu__link">Home</a>
    <a href="about.html" class="mobile-menu__link">About</a>
    <a href="support.html" class="mobile-menu__link">Support</a>
    <a href="signup.html" class="mobile-menu__cta">Sign up</a>
  </div>

  <div class="wrap">
    <nav>
      <a href="index.html" class="logo">
        <div class="logo-mark">
          <svg viewBox="0 0 30 26" fill="none">
            <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffb37a"/><stop offset="1" stop-color="#ff5a1f"/>
            </linearGradient></defs>
            <rect x="0" y="17" width="30" height="6" rx="3" fill="url(#lg)"/>
            <rect x="4" y="9" width="22" height="6" rx="3" fill="url(#lg)" opacity=".8"/>
            <rect x="8" y="1" width="14" height="6" rx="3" fill="url(#lg)" opacity=".55"/>
          </svg>
        </div>
        <div class="logo-text">
          <span class="brand-title">Scanned</span>
          <span class="brand-sub">by Nexlink Solutions</span>
        </div>
      </a>
      <div class="nav-pill">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="support.html">Support</a>
      </div>
      <div class="nav-right">
        <a href="signup.html" class="btn-solid-pill">Sign up</a>
      </div>
      <button id="menu-toggle" class="menu-toggle" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </nav>
  </div>

  <div class="wrap auth-container">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-sub">Log in to manage your contact card</p>

      <form id="login-form" onsubmit="return false;">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="auth-btn">Log in</button>
      </form>

      <div class="auth-divider">or</div>

      <button class="social-btn">
        <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Continue with Google
      </button>
      <button class="social-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
        Continue with Apple
      </button>

      <div class="auth-footer">
        <p>Don't have an account? <a href="signup.html">Sign up</a></p>
      </div>
    </div>
  </div>

  <div class="wrap">
    <footer>
      <a href="index.html" class="logo" style="justify-content:center;">
        <div class="logo-mark">
          <svg viewBox="0 0 30 26" fill="none">
            <rect x="0" y="17" width="30" height="6" rx="3" fill="#ff6a2c"/>
            <rect x="4" y="9" width="22" height="6" rx="3" fill="#ff6a2c" opacity=".8"/>
            <rect x="8" y="1" width="14" height="6" rx="3" fill="#ff6a2c" opacity=".55"/>
          </svg>
        </div>
        <div class="logo-text" style="text-align:left;">
          <span class="brand-title">Scanned</span>
          <span class="brand-sub">by Nexlink Solutions</span>
        </div>
      </a>
      <div class="foot-links">
        <a href="privacy.html">Privacy policy</a>
        <a href="terms.html">Terms</a>
        <a href="support.html">Support</a>
        <a href="about.html">About</a>
        <a href="#">© 2026 Scanned by Nexlink Solutions</a>
      </div>
    </footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
