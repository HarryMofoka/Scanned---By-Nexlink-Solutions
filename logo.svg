<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0c"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb37a"/>
      <stop offset="100%" stop-color="#ff5a1f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,106,44,0.3)" stroke-width="8"/>
  <g transform="translate(106, 156)">
    <rect x="0" y="140" width="300" height="60" rx="30" fill="url(#lg)" filter="url(#glow)"/>
    <rect x="40" y="70" width="220" height="60" rx="30" fill="url(#lg)" opacity="0.85"/>
    <rect x="80" y="0" width="140" height="60" rx="30" fill="url(#lg)" opacity="0.6"/>
  </g>
</svg>
